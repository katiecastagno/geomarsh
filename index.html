<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GeoMARSH: Chatham</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  #maps { position: absolute; inset: 0; }
  #map, #compare { position: absolute; inset: 0; }
  #compare { display: none; }

  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 5; width: 240px;
    background: rgba(255,255,255,.95); padding: 12px 14px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
  }
  #panel h1 { font-size: 16px; margin: 0 0 8px; }
  #panel label { display: block; margin: 8px 0 4px; font-weight: 600; }
  #panel select { width: 100%; padding: 4px; font: inherit; }
  #panel select:disabled { opacity: .5; }
  .legend { margin-top: 10px; }
  .legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .legend span.sw { width: 18px; height: 14px; border: 1px solid #0003; }
  .opacity { width: 100%; }
  .note { font-size: 12px; color: #555; margin-top: 8px; }

  /* Swipe handle */
  #slider {
    display: none; position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px;
    background: #fff; z-index: 4; cursor: ew-resize; box-shadow: 0 0 4px rgba(0,0,0,.5);
  }
  #slider::after {
    content: "◀ ▶"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #fff; border-radius: 14px; padding: 4px 6px; font-size: 11px; white-space: nowrap;
    box-shadow: 0 0 4px rgba(0,0,0,.4);
  }
  .tag {
    display: none; position: absolute; top: 12px; z-index: 4; background: rgba(0,0,0,.65);
    color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px;
  }
  #tagL { left: 270px; } #tagR { right: 50px; }

  .maplibregl-popup-content { font-size: 12px; max-height: 320px; overflow-y: auto; }
  .maplibregl-popup-content table { border-collapse: collapse; }
  .maplibregl-popup-content td { padding: 1px 6px 1px 0; }
  .maplibregl-popup-content td:last-child { font-weight: 600; text-align: right; }
  .maplibregl-popup-content tr.sep td { border-top: 1px solid #ddd; padding-top: 4px; }
</style>
</head>
<body>
<div id="maps">
  <div id="map"></div>
  <div id="compare"></div>
  <div id="slider"></div>
  <div class="tag" id="tagL">Current</div>
  <div class="tag" id="tagR">Future</div>
</div>

<div id="panel">
  <h1>GeoMARSH: Chatham</h1>

  <label for="field">Show score</label>
  <select id="field">
    <option value="Prioritization_Score_Current">Current prioritization</option>
    <option value="Prioritization_Score_Future">Future prioritization</option>
    <option value="Suitability_Score">Suitability</option>
  </select>

  <label><input type="checkbox" id="swipe"> Swipe: Current | Future</label>

  <label for="opacity">Grid opacity</label>
  <input type="range" id="opacity" class="opacity" min="0" max="1" step="0.05" value="0.8">

  <div class="legend" id="legend"></div>
  <div class="note">Click a cell for its component scores.</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------
const PMTILES_FILE = "data/geomarsh.pmtiles";
const SOURCE_LAYER = "grid";                       // the -l name used in tippecanoe
const BOUNDS = [[-70.0273, 41.6681], [-69.9730, 41.6828]];

// Class breaks (match ArcGIS Online). Colors estimated from the AGOL legend.
const CLASSES = [
  { label: "< 0.5",    min: -Infinity, color: "#fbe8e6" },
  { label: "0.5–0.6",  min: 0.5,       color: "#e8bcae" },
  { label: "0.6–0.75", min: 0.6,       color: "#d08b75" },
  { label: "0.75–0.9", min: 0.75,      color: "#b45a45" },
  { label: "> 0.9",    min: 0.9,       color: "#ef7ad6" }
];

// Friendly names for the popup
const LABELS = {
  GRID_ID: "Grid ID",
  Prioritization_Score_Current: "Current prioritization",
  Prioritization_Score_Future: "Future prioritization",
  Suitability_Score: "Suitability",
  Elevation_Score: "Elevation",
  Slope_Score: "Slope",
  AccomProximity_Score: "Accommodation proximity",
  AccomThickness_Score: "Accommodation thickness",
  SedAvailability_Score: "Sediment availability",
  Status_Restricted: "Restricted",
  Status_Unvegetated: "Unvegetated",
  Status_Ditch: "Ditch",
  Status_Phrag: "Phragmites",
  Status_Marsh: "Marsh",
  Status_Accommodation: "Accommodation"
};
const POPUP_GROUPS = [
  ["Prioritization_Score_Current", "Prioritization_Score_Future", "Suitability_Score"],
  ["Elevation_Score", "Slope_Score", "AccomProximity_Score", "AccomThickness_Score", "SedAvailability_Score"],
  ["Status_Restricted", "Status_Unvegetated", "Status_Ditch", "Status_Phrag", "Status_Marsh", "Status_Accommodation"]
];

// ---------------------------------------------------------------------------
// Map setup
// ---------------------------------------------------------------------------
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
const pmUrl = "pmtiles://" + new URL(PMTILES_FILE, location.href).href;

function colorFor(field) {
  const expr = ["step", ["coalesce", ["to-number", ["get", field]], -1], CLASSES[0].color];
  CLASSES.slice(1).forEach(c => expr.push(c.min, c.color));
  return expr;
}

function makeStyle(field) {
  return {
    version: 8,
    sources: {
      imagery: {
        type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
      },
      grid: { type: "vector", url: pmUrl, attribution: "GeoMARSH" }
    },
    layers: [
      { id: "imagery", type: "raster", source: "imagery" },
      { id: "grid", type: "fill", source: "grid", "source-layer": SOURCE_LAYER,
        paint: { "fill-color": colorFor(field), "fill-opacity": 0.8 } }
    ]
  };
}

const map = new maplibregl.Map({
  container: "map", style: makeStyle("Prioritization_Score_Current"),
  bounds: BOUNDS, fitBoundsOptions: { padding: 40 }, maxZoom: 20
});
map.addControl(new maplibregl.NavigationControl(), "top-right");
map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");

const compare = new maplibregl.Map({
  container: "compare", style: makeStyle("Prioritization_Score_Future"),
  bounds: BOUNDS, fitBoundsOptions: { padding: 40 }, maxZoom: 20, attributionControl: false
});

// ---------------------------------------------------------------------------
// Keep the two maps' views in sync
// ---------------------------------------------------------------------------
let syncing = false;
function syncFrom(src, dst) {
  src.on("move", () => {
    if (syncing) return;
    syncing = true;
    dst.jumpTo({ center: src.getCenter(), zoom: src.getZoom(),
                 bearing: src.getBearing(), pitch: src.getPitch() });
    syncing = false;
  });
}
syncFrom(map, compare);
syncFrom(compare, map);

// ---------------------------------------------------------------------------
// Popups
// ---------------------------------------------------------------------------
function fmt(v) {
  if (v === null || v === undefined || v === "") return "–";
  const n = Number(v);
  return Number.isFinite(n) ? (Number.isInteger(n) ? String(n) : n.toFixed(3)) : String(v);
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function popupHtml(p) {
  let html = `<b>Grid ${esc(fmt(p.GRID_ID))}</b><table>`;
  POPUP_GROUPS.forEach((group, gi) => {
    group.filter(k => k in p).forEach((k, i) => {
      html += `<tr class="${gi > 0 && i === 0 ? "sep" : ""}"><td>${esc(LABELS[k] || k)}</td><td>${esc(fmt(p[k]))}</td></tr>`;
    });
  });
  return html + "</table>";
}
[map, compare].forEach(m => {
  m.on("click", "grid", e => {
    new maplibregl.Popup({ maxWidth: "280px" })
      .setLngLat(e.lngLat).setHTML(popupHtml(e.features[0].properties)).addTo(m);
  });
  m.on("mouseenter", "grid", () => m.getCanvas().style.cursor = "pointer");
  m.on("mouseleave", "grid", () => m.getCanvas().style.cursor = "");
});

// ---------------------------------------------------------------------------
// Controls: score dropdown, opacity, legend
// ---------------------------------------------------------------------------
const fieldSel = document.getElementById("field");
const opacity = document.getElementById("opacity");

document.getElementById("legend").innerHTML = CLASSES.map(c =>
  `<div><span class="sw" style="background:${c.color}"></span>${c.label}</div>`).join("");

fieldSel.addEventListener("change", () => {
  map.setPaintProperty("grid", "fill-color", colorFor(fieldSel.value));
});
opacity.addEventListener("input", () => {
  const v = Number(opacity.value);
  [map, compare].forEach(m => { if (m.getLayer("grid")) m.setPaintProperty("grid", "fill-opacity", v); });
});

// ---------------------------------------------------------------------------
// Swipe (Current on the left, Future on the right)
// ---------------------------------------------------------------------------
const swipeBox = document.getElementById("swipe");
const slider = document.getElementById("slider");
const compareDiv = document.getElementById("compare");
const tags = [document.getElementById("tagL"), document.getElementById("tagR")];
let swipeX = 0.5;   // fraction of the window width

function placeSlider() {
  const w = document.getElementById("maps").clientWidth;
  const px = Math.round(swipeX * w);
  slider.style.left = px + "px";
  compareDiv.style.clipPath = `inset(0 0 0 ${px}px)`;
}

swipeBox.addEventListener("change", () => {
  const on = swipeBox.checked;
  compareDiv.style.display = slider.style.display = on ? "block" : "none";
  tags.forEach(t => t.style.display = on ? "block" : "none");
  fieldSel.disabled = on;
  map.setPaintProperty("grid", "fill-color",
    colorFor(on ? "Prioritization_Score_Current" : fieldSel.value));
  if (on) {
    compare.resize();
    compare.jumpTo({ center: map.getCenter(), zoom: map.getZoom(),
                     bearing: map.getBearing(), pitch: map.getPitch() });
    if (compare.getLayer("grid")) compare.setPaintProperty("grid", "fill-opacity", Number(opacity.value));
    placeSlider();
  }
});

let dragging = false;
slider.addEventListener("pointerdown", e => { dragging = true; slider.setPointerCapture(e.pointerId); });
slider.addEventListener("pointermove", e => {
  if (!dragging) return;
  const rect = document.getElementById("maps").getBoundingClientRect();
  swipeX = Math.min(0.98, Math.max(0.02, (e.clientX - rect.left) / rect.width));
  placeSlider();
});
slider.addEventListener("pointerup", () => { dragging = false; });
window.addEventListener("resize", () => { if (swipeBox.checked) placeSlider(); });
</script>
</body>
</html>
